<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node Shield - Security Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e6ed;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: rgba(15, 20, 40, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 107, 107, 0.1);
      padding: 30px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 30px;
    }

    .header-left h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b6b 0%, #ff922b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #999;
      font-weight: 500;
    }

    .refresh-btn {
      padding: 12px 28px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ff922b 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 107, 107, 0.4);
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 30px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: rgba(26, 31, 46, 0.5);
      backdrop-filter: blur(10px);
      padding: 28px;
      border-radius: 12px;
      border: 1px solid rgba(255, 107, 107, 0.1);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff6b6b, #ff922b);
    }

    .stat-card:hover {
      border-color: rgba(255, 107, 107, 0.2);
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(255, 107, 107, 0.15);
    }

    .stat-number {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b 0%, #ff922b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 12px;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid rgba(255, 107, 107, 0.1);
      margin-bottom: 30px;
      background: rgba(26, 31, 46, 0.3);
      border-radius: 12px 12px 0 0;
      padding: 0 24px;
    }

    .tab {
      padding: 16px 24px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: #888;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      background: transparent;
      border: none;
    }

    .tab:hover {
      color: #c0c7d4;
    }

    .tab.active {
      color: #ff6b6b;
      border-bottom-color: #ff6b6b;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(26, 31, 46, 0.3);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 107, 107, 0.1);
    }

    th {
      background: rgba(26, 31, 46, 0.8);
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 107, 107, 0.1);
      color: #ff6b6b;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 107, 107, 0.05);
      font-size: 13px;
    }

    tbody tr {
      transition: background 0.2s ease;
    }

    tbody tr:hover {
      background: rgba(255, 107, 107, 0.08);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* Severity Badges */
    .severity {
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      display: inline-block;
    }

    .severity-critical {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.15);
    }

    .severity-high {
      color: #ff922b;
      background: rgba(255, 146, 43, 0.15);
    }

    .severity-medium {
      color: #ffd93d;
      background: rgba(255, 217, 61, 0.15);
    }

    .severity-low {
      color: #51cf66;
      background: rgba(81, 207, 102, 0.15);
    }

    .ip-addr {
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      color: #ff922b;
      background: rgba(26, 31, 46, 0.5);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* Attackers List */
    .attacker-item {
      background: rgba(26, 31, 46, 0.5);
      border: 1px solid rgba(255, 107, 107, 0.1);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .attacker-item:hover {
      border-color: rgba(255, 107, 107, 0.2);
      background: rgba(26, 31, 46, 0.7);
      transform: translateX(4px);
    }

    .attacker-ip {
      color: #ff6b6b;
      font-weight: 700;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
    }

    .attacker-count {
      color: #ff922b;
      font-weight: 700;
      font-size: 20px;
    }

    /* Stats Box */
    .stats-box {
      background: rgba(26, 31, 46, 0.5);
      border: 1px solid rgba(255, 107, 107, 0.1);
      padding: 28px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .stats-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 107, 107, 0.05);
      font-size: 14px;
    }

    .stats-item:last-child {
      border-bottom: none;
    }

    .stats-label {
      color: #999;
      font-weight: 500;
    }

    .stats-value {
      color: #ff922b;
      font-weight: 700;
    }

    /* Status Indicator */
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #51cf66;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(81, 207, 102, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(81, 207, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(81, 207, 102, 0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stat-card {
      animation: slideIn 0.6s ease backwards;
    }

    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card:nth-child(4) { animation-delay: 0.4s; }
    .stat-card:nth-child(5) { animation-delay: 0.5s; }
    .stat-card:nth-child(6) { animation-delay: 0.6s; }

    /* Responsive */
    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: 20px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .tabs {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-left">
        <h1>🛡️ Node Shield</h1>
        <div class="header-subtitle"><span class="status-indicator"></span>Runtime Protection Dashboard</div>
      </div>
      <button class="refresh-btn" onclick="location.reload()">↻ Refresh</button>
    </div>
  </header>

  <div class="main-content">
    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="total">0</div>
        <div class="stat-label">Total Attacks</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="sql">0</div>
        <div class="stat-label">SQL Injections</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="rce">0</div>
        <div class="stat-label">RCE Attempts</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="path">0</div>
        <div class="stat-label">Path Traversals</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="cmd">0</div>
        <div class="stat-label">Cmd Injections</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="xss">0</div>
        <div class="stat-label">XSS Attempts</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="nosql">0</div>
        <div class="stat-label">NoSQL Injections</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="xxe">0</div>
        <div class="stat-label">XXE Attacks</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="ldap">0</div>
        <div class="stat-label">LDAP Injections</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="ratelimit">0</div>
        <div class="stat-label">Rate Limit Alerts</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('attacks')">Recent Attacks</button>
      <button class="tab" onclick="switchTab('attackers')">Top Attackers</button>
      <button class="tab" onclick="switchTab('stats')">Statistics</button>
    </div>

    <!-- Attacks Tab -->
    <div id="attacks" class="tab-content active">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Severity</th>
            <th>Type</th>
            <th>From IP</th>
            <th>Endpoint</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="attacks-tbody"></tbody>
      </table>
    </div>

    <!-- Attackers Tab -->
    <div id="attackers" class="tab-content">
      <div id="attackers-list"></div>
    </div>

    <!-- Stats Tab -->
    <div id="stats" class="tab-content">
      <div id="stats-content"></div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab).classList.add('active');
    }

    async function loadData() {
      const res = await fetch('/api/attacks');
      const statsRes = await fetch('/api/stats');
      const data = await res.json();
      const stats = await statsRes.json();

      // Update stat cards
      document.getElementById('total').textContent = data.attacks.length;
      document.getElementById('sql').textContent = data.attacks.filter(a => a.type === 'SQL Injection').length;
      document.getElementById('rce').textContent = data.attacks.filter(a => a.type === 'RCE').length;
      document.getElementById('path').textContent = data.attacks.filter(a => a.type === 'Path Traversal').length;
      document.getElementById('cmd').textContent = data.attacks.filter(a => a.type === 'Command Injection').length;
      document.getElementById('xss').textContent = data.attacks.filter(a => a.type === 'XSS').length;
      document.getElementById('nosql').textContent = data.attacks.filter(a => a.type === 'NoSQL Injection').length;
      document.getElementById('xxe').textContent = data.attacks.filter(a => a.type === 'XXE').length;
      document.getElementById('ldap').textContent = data.attacks.filter(a => a.type === 'LDAP Injection').length;
      document.getElementById('ratelimit').textContent = stats.rateLimit || 0;

      // Attacks table
      const tbody = document.getElementById('attacks-tbody');
      tbody.innerHTML = data.attacks.map(attack => {
        const severity = attack.severity || 'MEDIUM';
        return \`
          <tr>
            <td>\${new Date(attack.timestamp).toLocaleTimeString()}</td>
            <td><span class="severity severity-\${severity.toLowerCase()}">\${severity}</span></td>
            <td>\${attack.type}</td>
            <td><span class="ip-addr">\${attack.ip}</span></td>
            <td>\${attack.endpoint}</td>
            <td>\${attack.rateLimit ? '⚠️ BLOCKED' : '✓ BLOCKED'}</td>
          </tr>
        \`;
      }).reverse().join('');

      // Top attackers
      const attackersList = document.getElementById('attackers-list');
      attackersList.innerHTML = stats.topAttackers.map(att => \`
        <div class="attacker-item">
          <span class="attacker-ip">\${att.ip}</span>
          <span class="attacker-count">\${att.count}</span>
        </div>
      \`).join('');

      // Stats
      const byType = Object.entries(stats.byType || {})
        .sort((a, b) => b[1] - a[1])
        .map(([type, count]) => \`
          <div class="stats-item">
            <span class="stats-label">\${type}</span>
            <span class="stats-value">\${count}</span>
          </div>
        \`).join('');

      document.getElementById('stats-content').innerHTML = \`
        <div class="stats-box">
          <div class="stats-item">
            <span class="stats-label">Last 24 Hours</span>
            <span class="stats-value">\${stats.last24h}</span>
          </div>
          <div class="stats-item">
            <span class="stats-label">Rate Limit Triggers</span>
            <span class="stats-value">\${stats.rateLimit}</span>
          </div>
        </div>
        <div class="stats-box">
          <strong style="color: #ff6b6b;">Attacks by Type</strong>
          \${byType}
        </div>
      \`;
    }

    loadData();
    setInterval(loadData, 2000);
  </script>
</body>
</html>
